name: Build ESP32 Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
      with:
        version: "0.35.3"
        
    - name: Install ESP32 core
      run: |
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.0.7
        
    - name: Install required libraries
      run: |
        arduino-cli lib update-index
        arduino-cli lib install CAN
        # can_common 不在官方索引中，需从 GitHub 克隆安装
        arduino-cli lib install --git-url https://github.com/collin80/can_common
        # 顺便安装 esp32_can 库以备不时之需
        arduino-cli lib install --git-url https://github.com/collin80/esp32_can
        
    - name: Rename sketch to match folder name
      run: |
        mv ./firmware/esp32_tx_verify.ino ./firmware/firmware.ino
        
    - name: Build sketch
      run: |
        arduino-cli compile --verbose --fqbn esp32:esp32:esp32 ./firmware/firmware.ino --output-dir ./firmware/build
        
    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32-firmware
        path: ./firmware/build/*.bin
